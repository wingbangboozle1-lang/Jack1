# Publication scope for GitHub Pages
#
# The published product is seventeen source-linked pages generated by
# scripts/build_pages.py. Everything else in this repository is the audit trail:
# superseded dashboards from earlier sessions, raw research notes, datasets,
# tooling and the coordination board. Those files stay in the repository for
# traceability but are deliberately NOT published, because earlier builds served
# several competing dashboards from the same root and some of them carried
# figures this brief has since withdrawn.
#
# Jekyll is used here only as the file filter for the legacy branch build (there
# is intentionally no .nojekyll). Every published page is plain static HTML with
# no front matter, so Jekyll copies it byte-for-byte instead of transforming it.
#
# The GitHub Actions workflow publishes the same seventeen pages plus 404.html
# and the three asset files, so both publishers emit an identical artifact.

title: Jack in the Box property decision brief
description: Source-linked, privacy-first decision brief for a Jack in the Box NNN property described as near central Los Angeles.

# Published: index, geography, population, income, schools, economy, jobs,
# projections, property, tenant, decision, risks, requirements, repo-review,
# flagged, sources, audit, 404, assets/styles.css, assets/site.js,
# assets/favicon.svg

exclude:
  # Superseded root pages from earlier builds, kept in the repository only as
  # provenance. They publish withdrawn figures and must never be served.
  - market.html
  - model.html
  - projection.html
  - risk.html
  - archive
  - pages
  - site
  - data
  - research
  - analysis
  - model
  - risks
  - tools
  - scripts
  - verification
  - .github
  - COORDINATION.md
  - README.md
  - DECISION_MEMO.md
  - EXECUTIVE_SUMMARY.md
  - METHODOLOGY.md
  - RISK_REGISTER.md
  - executive_summary.md
  - Gemfile
  - Gemfile.lock
  - vendor
