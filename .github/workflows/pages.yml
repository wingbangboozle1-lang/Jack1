name: Validate and publish the decision brief

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate site and source links
        run: python scripts/validate_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the public dashboard files only
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html geography.html population.html income.html schools.html \
             economy.html jobs.html projections.html property.html tenant.html \
             decision.html risks.html requirements.html repo-review.html \
             flagged.html sources.html audit.html 404.html _site/
          cp assets/styles.css assets/site.js assets/favicon.svg _site/assets/
          echo "Assembled $(find _site -type f | wc -l) public files"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
