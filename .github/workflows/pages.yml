name: Validate decision brief (legacy Pages publication)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generated pages match verified dataset
        run: python scripts/build_public.py --check
      - name: Run projection, build, privacy, and source tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate canonical site
        run: python scripts/validate_site.py
      - name: Build and validate curated artifact boundary
        run: |
          python scripts/build_public.py --out _site
          python scripts/validate_site.py --site _site --artifact

# GitHub Pages is configured for legacy main / source. GitHub runs its own
# pages-build-deployment on main pushes after this validation. An Actions
# deploy-pages job fails under legacy mode (and this integration token cannot
# change build_type: GitHub API 403), so do not race the automatic deployment.
# Reintroduce workflow-built upload/deploy only after an administrator switches
# Pages to build_type=workflow and that path is independently verified.
