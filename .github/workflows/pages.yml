name: Validate the decision brief

# GitHub Pages for this repository is published from the main branch, root
# directory (legacy branch build). This workflow therefore validates only: it
# must never publish an artifact, because an artifact deployment and a branch
# build would race each other for the same URL.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild the site from the dataset and compare
        run: |
          set -eu
          cp index.html /tmp/index.before.html
          python3 scripts/build_site.py
          git diff --exit-code -- index.html demographics.html economy.html \
            schools.html property.html tenant.html model.html decision.html \
            risks.html flagged.html sources.html assets/styles.css \
            assets/site.js assets/favicon.svg data/published-records.json

      - name: Validate structure, links and the blank-value rule
        run: python3 scripts/validate_site.py
