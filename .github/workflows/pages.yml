name: Validate and publish the decision brief

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate the site from the verified dataset
        run: |
          set -eu
          python tools/build_dataset.py
          python tools/build_brief.py
      - name: Confirm generated pages match the committed build
        run: |
          set -eu
          git diff --exit-code -- '*.html' 'data/brief_*.json' robots.txt sitemap.xml
      - name: Verify sources, links, table citations, flags and privacy
        run: |
          set -eu
          python tools/verify_brief.py
          python scripts/validate_site.py
          python tools/projection.py --self-test

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the public dashboard files only
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html decision.html projection.html property.html tenant.html \
             market.html geography.html demographics.html income.html employment.html \
             schools.html economy.html hazards.html regulatory.html risks.html \
             sources.html flagged.html privacy.html scope.html \
             model.html risk.html 404.html _site/
          cp assets/brief.css assets/brief.js assets/styles.css assets/site.js _site/assets/
          cp .nojekyll _site/.nojekyll
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          echo "Assembled $(find _site -type f | wc -l) public files"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
