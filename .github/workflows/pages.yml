name: Validate and publish the decision brief

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generated pages must match their register (no hand edits, no drift)
        run: |
          set -eu
          python3 scripts/build_verification.py
          python3 scripts/build_projection.py
          if ! git diff --quiet; then
            echo "::error::A generated page no longer matches its source register. Re-run scripts/build_verification.py and scripts/build_projection.py and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Validate site, table citations, blanks, navigation and links
        run: python3 scripts/validate_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the public dashboard files only
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html market.html property.html decision.html projection.html \
             risks.html flagged.html verification.html sources.html _site/
          cp assets/styles.css assets/site.js _site/assets/
          cp .nojekyll _site/.nojekyll
          echo "Assembled $(find _site -type f | wc -l) public files"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
