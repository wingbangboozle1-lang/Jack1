name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (site files only)
        run: |
          set -e
          mkdir -p _site
          cp -r ./*.html _site/
          cp -r assets _site/
          cp -r data _site/
          cp .nojekyll _site/
          # provenance: prior session builds, not part of the live navigation
          mkdir -p _site/archive && cp -r archive/* _site/archive/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
